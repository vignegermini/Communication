<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Ponte Papai">
<title>Ponte — Papai</title>
<script src="https://cdn.ably.com/lib/ably.min-2.js"></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,300;0,600;1,300&family=DM+Sans:wght@300;400;500&display=swap');
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #1C1410; --surface: #261C16; --border: #3D2E26;
    --text: #F2E8DF; --muted: #8A7060; --accent: #D4845A;
    --accent-soft: #2E1E14; --accent-glow: rgba(212,132,90,0.25);
    --green: #5AAD7A; --red: #C85A5A;
  }
  html, body { height: 100%; background: var(--bg); color: var(--text); font-family: 'DM Sans', sans-serif; overflow: hidden; -webkit-text-size-adjust: 100%; }
  body { display: flex; flex-direction: column; height: 100dvh; padding-top: env(safe-area-inset-top); padding-bottom: env(safe-area-inset-bottom); }

  .header { padding: 18px 24px 14px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid var(--border); flex-shrink: 0; }
  .header-title { font-family: 'Fraunces', serif; font-size: 1.3rem; font-weight: 300; }
  .header-title span { color: var(--accent); font-style: italic; }
  .conn-pill { display: flex; align-items: center; gap: 6px; background: var(--surface); border: 1px solid var(--border); border-radius: 20px; padding: 5px 10px; }
  .conn-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); transition: background 0.4s; }
  .conn-dot.connected { background: var(--green); box-shadow: 0 0 6px var(--green); }
  .conn-dot.error { background: var(--red); }
  .conn-label { font-size: 0.72rem; color: var(--muted); }

  .main { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 24px; padding: 20px; overflow: hidden; }

  .mic-wrap { position: relative; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
  .mic-ring { position: absolute; width: 144px; height: 144px; border-radius: 50%; border: 2px solid var(--accent); opacity: 0; pointer-events: none; }
  .mic-ring.pulse { animation: ringPulse 1.6s ease-out infinite; }
  .mic-ring.delay { animation-delay: 0.8s !important; }
  @keyframes ringPulse { 0% { transform: scale(0.85); opacity: 0.7; } 100% { transform: scale(1.9); opacity: 0; } }

  .mic-btn { width: 128px; height: 128px; border-radius: 50%; border: none; background: var(--accent); color: var(--bg); font-size: 3.2rem; cursor: pointer; display: flex; align-items: center; justify-content: center; position: relative; z-index: 1; transition: background 0.25s, transform 0.12s; box-shadow: 0 8px 32px var(--accent-glow); -webkit-tap-highlight-color: transparent; touch-action: manipulation; user-select: none; }
  .mic-btn:active { transform: scale(0.91); }
  .mic-btn.listening { background: var(--red); box-shadow: 0 8px 32px rgba(200,90,90,0.4); }
  .mic-btn.sending   { background: var(--green); box-shadow: 0 8px 32px rgba(90,173,122,0.4); }

  .vol-bars { display: flex; align-items: flex-end; gap: 4px; height: 26px; opacity: 0; transition: opacity 0.3s; flex-shrink: 0; }
  .vol-bars.active { opacity: 1; }
  .vol-bar { width: 5px; background: var(--accent); border-radius: 3px; height: 4px; }

  .status-text { font-size: 0.95rem; color: var(--muted); text-align: center; font-weight: 300; transition: color 0.3s; flex-shrink: 0; padding: 0 20px; }
  .status-text.active { color: var(--accent); }
  .status-text.sent   { color: var(--green); }

  .transcript-card { width: 100%; max-width: 400px; background: var(--surface); border: 1px solid var(--border); border-radius: 18px; padding: 18px; min-height: 90px; max-height: 150px; overflow-y: auto; flex-shrink: 0; }
  .transcript-inner { font-family: 'Fraunces', serif; font-size: 1.2rem; font-weight: 300; line-height: 1.5; color: var(--text); }
  .t-ph { color: var(--muted); font-size: 0.88rem; font-family: 'DM Sans', sans-serif; font-style: italic; }
  .interim { color: var(--muted); }

  .sent-log { width: 100%; max-width: 400px; flex-shrink: 0; }
  .sent-label { font-size: 0.7rem; text-transform: uppercase; letter-spacing: 0.1em; color: var(--muted); margin-bottom: 7px; }
  .sent-items { display: flex; flex-direction: column; gap: 5px; max-height: 90px; overflow-y: auto; }
  .sent-item { background: var(--accent-soft); border: 1px solid var(--border); border-radius: 10px; padding: 7px 12px; font-size: 0.82rem; display: flex; gap: 8px; align-items: flex-start; }
  .sent-item .check { color: var(--green); flex-shrink: 0; }
  .sent-item .msg   { color: var(--text); line-height: 1.4; flex: 1; }
  .sent-item .ts    { color: var(--muted); font-size: 0.72rem; flex-shrink: 0; }

  .footer { padding: 10px 24px 12px; text-align: center; font-size: 0.72rem; color: var(--muted); flex-shrink: 0; border-top: 1px solid var(--border); }
  ::-webkit-scrollbar { width: 3px; } ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
</style>
</head>
<body>
<div class="header">
  <div class="header-title">Ponte — <span>Papai</span></div>
  <div class="conn-pill"><div class="conn-dot" id="connDot"></div><span class="conn-label" id="connLabel">Conectando...</span></div>
</div>

<div class="main">
  <div class="mic-wrap">
    <div class="mic-ring" id="ring1"></div>
    <div class="mic-ring delay" id="ring2"></div>
    <button class="mic-btn" id="micBtn" onclick="handleMicTap()">🎙️</button>
  </div>

  <div class="vol-bars" id="volBars">
    <div class="vol-bar" id="vb0"></div><div class="vol-bar" id="vb1"></div>
    <div class="vol-bar" id="vb2"></div><div class="vol-bar" id="vb3"></div>
    <div class="vol-bar" id="vb4"></div>
  </div>

  <div class="status-text" id="statusText">Toque para começar a falar</div>

  <div class="transcript-card">
    <div class="transcript-inner" id="transcript"><span class="t-ph">O que você falar aparece aqui...</span></div>
  </div>

  <div class="sent-log">
    <div class="sent-label">Enviado para Mamãe</div>
    <div class="sent-items" id="sentItems">
      <div class="sent-item" style="opacity:0.4;"><span class="check">—</span><span class="msg" style="font-style:italic;">Nenhuma mensagem ainda</span></div>
    </div>
  </div>
</div>

<div class="footer">Fale naturalmente — envia automaticamente após pausa de silêncio</div>

<script>
// ── ABLY CONFIG ────────────────────────────────────────────────────────────
const ABLY_KEY   = 'QdXAyw.CAMQTA:NpWhLeFiTrS7nu14IwRDNakDzFlriNq-XM5JIlYilSQ';
const CHANNEL_NAME = 'ponte-familia';
const SILENCE_MS   = 2500;

// ── State ──────────────────────────────────────────────────────────────────
let ably, channel, recognition;
let isListening = false, finalText = '', interimText = '';
let silenceTimer = null, sentList = [], barAnim = null;
const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent);

// ── Ably connection ────────────────────────────────────────────────────────
function connectAbly() {
  ably = new Ably.Realtime({ key: ABLY_KEY, clientId: 'papai' });

  ably.connection.on('connected', () => setConn('connected', 'Conectado'));
  ably.connection.on('disconnected', () => setConn('', 'Reconectando...'));
  ably.connection.on('suspended', () => setConn('error', 'Sem conexão'));
  ably.connection.on('failed', () => setConn('error', 'Erro'));

  channel = ably.channels.get(CHANNEL_NAME);
}

function setConn(s, l) {
  document.getElementById('connDot').className = 'conn-dot' + (s ? ' ' + s : '');
  document.getElementById('connLabel').textContent = l;
}

function sendMessage(text) {
  text = text.trim();
  if (!text) return;
  channel.publish('mensagem', { text, ts: Date.now() }, (err) => {
    if (err) { setConn('error', 'Erro ao enviar'); return; }
    addSent(text);
    flashSent();
  });
  finalText = interimText = '';
  renderTranscript();
}

// ── Speech Recognition ─────────────────────────────────────────────────────
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;

function setupSR() {
  if (!SR) return false;
  recognition = new SR();
  recognition.continuous     = !isIOS;
  recognition.interimResults = true;
  recognition.lang           = 'pt-BR';

  recognition.onresult = (e) => {
    clearTimeout(silenceTimer);
    let interim = '';
    for (let i = e.resultIndex; i < e.results.length; i++) {
      if (e.results[i].isFinal) finalText += e.results[i][0].transcript + ' ';
      else interim += e.results[i][0].transcript;
    }
    interimText = interim;
    renderTranscript();
    silenceTimer = setTimeout(() => {
      const t = (finalText + interimText).trim();
      if (t) sendMessage(t);
    }, SILENCE_MS);
  };

  recognition.onerror = (e) => {
    if (e.error === 'no-speech') { if (isListening) tryRestart(); return; }
    if (e.error === 'not-allowed') {
      setStatus('Permissão negada. Vá em Ajustes > Safari > Microfone.', '');
      stopMic(); return;
    }
  };

  recognition.onend = () => { if (isListening) tryRestart(); };
  return true;
}

function tryRestart() {
  setTimeout(() => { if (isListening) { try { recognition.start(); } catch(e){} } }, 250);
}

function handleMicTap() { if (isListening) stopMic(); else startMic(); }

function startMic() {
  if (!SR) { alert('Use Safari no iPhone para usar o microfone.'); return; }
  if (!recognition && !setupSR()) return;
  try {
    recognition.start();
    isListening = true;
    document.getElementById('micBtn').className   = 'mic-btn listening';
    document.getElementById('micBtn').textContent = '⏹️';
    document.getElementById('ring1').classList.add('pulse');
    document.getElementById('ring2').classList.add('pulse');
    document.getElementById('volBars').classList.add('active');
    setStatus('Ouvindo... fale agora', 'active');
    startBars();
  } catch(e) { setStatus('Erro ao iniciar. Tente novamente.', ''); }
}

function stopMic() {
  isListening = false;
  clearTimeout(silenceTimer);
  try { recognition && recognition.stop(); } catch(e){}
  document.getElementById('micBtn').className   = 'mic-btn';
  document.getElementById('micBtn').textContent = '🎙️';
  document.getElementById('ring1').classList.remove('pulse');
  document.getElementById('ring2').classList.remove('pulse');
  document.getElementById('volBars').classList.remove('active');
  cancelAnimationFrame(barAnim);
  setStatus('Toque para começar a falar', '');
  finalText = interimText = '';
  renderTranscript();
}

function setStatus(m, c) {
  const el = document.getElementById('statusText');
  el.textContent = m;
  el.className = 'status-text' + (c ? ' ' + c : '');
}

function renderTranscript() {
  const el = document.getElementById('transcript');
  const t  = finalText + interimText;
  el.innerHTML = t.trim()
    ? esc(finalText) + (interimText ? `<span class="interim">${esc(interimText)}</span>` : '')
    : '<span class="t-ph">O que você falar aparece aqui...</span>';
}

function addSent(text) {
  const ts = new Date().toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' });
  sentList.unshift({ text, ts });
  if (sentList.length > 6) sentList.pop();
  document.getElementById('sentItems').innerHTML = sentList.map(s =>
    `<div class="sent-item"><span class="check">✓</span><span class="msg">${esc(s.text)}</span><span class="ts">${s.ts}</span></div>`
  ).join('');
}

function flashSent() {
  const btn = document.getElementById('micBtn');
  btn.className = 'mic-btn sending'; btn.textContent = '✓';
  setStatus('Enviado! ✓', 'sent');
  setTimeout(() => {
    btn.className   = isListening ? 'mic-btn listening' : 'mic-btn';
    btn.textContent = isListening ? '⏹️' : '🎙️';
    setStatus(isListening ? 'Ouvindo... fale agora' : 'Toque para começar a falar', isListening ? 'active' : '');
  }, 1500);
}

function startBars() {
  const ids = ['vb0','vb1','vb2','vb3','vb4'];
  function f() {
    if (!isListening) return;
    ids.forEach(id => { document.getElementById(id).style.height = (Math.random() * 20 + 3) + 'px'; });
    barAnim = requestAnimationFrame(() => setTimeout(f, 110));
  }
  f();
}

function esc(s) { return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

connectAbly();
</script>
</body>
</html>
